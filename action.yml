name: 'VPN Teardown'
description: 'Encerra túnel VPN e limpa arquivos de trabalho (idempotente)'
author: 'vcyber-tech'

branding:
  icon: 'shield'
  color: 'gray-dark'

inputs:
  version:
    description: |
      Versão do vpnctl no formato do monorepo (ex: vpn-teardown/v1.2.0).
      Se vazio, é derivada da tag desta action — `@v1.0.0` vira
      `vpn-teardown/v1.0.0`, e `@v1` resolve a release `vpn-teardown/v1.x.y`
      mais recente.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    # ----------- 1. Detectar plataforma -----------
    - name: Detectar target de build
      id: target
      shell: bash
      run: |
        set -euo pipefail
        case "${{ runner.os }}-${{ runner.arch }}" in
          Linux-X64)   TARGET="x86_64-unknown-linux-musl" ;;
          Linux-ARM64) TARGET="aarch64-unknown-linux-musl" ;;
          *)
            echo "::warning::vpn-teardown não suporta ${{ runner.os }}-${{ runner.arch }}; ignorando"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
            ;;
        esac
        echo "target=$TARGET" >> "$GITHUB_OUTPUT"
        echo "skip=false" >> "$GITHUB_OUTPUT"

    # ----------- 2. Resolver versão do vpnctl -----------
    # A tag do wrapper (`v1` ou `v1.0.0`) é mapeada para a tag do
    # monorepo (`vpn-teardown/v1` ou `vpn-teardown/v1.0.0`).
    - name: Resolver versão do vpnctl
      id: version
      if: steps.target.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: vcyber-tech/actions-rust
        INPUT_VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail

        if [ -n "$INPUT_VERSION" ]; then
          # Já está no formato do monorepo (vpn-teardown/vX.Y.Z).
          VERSION="$INPUT_VERSION"
        elif [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          # Tag exata do wrapper: v1.2.3 → vpn-teardown/v1.2.3
          VERSION="vpn-teardown/${ACTION_REF}"
        elif [[ "$ACTION_REF" =~ ^v([0-9]+)$ ]]; then
          # Tag flutuante do wrapper: v1 → vpn-teardown/v1.x.y mais recente
          MAJOR="${BASH_REMATCH[1]}"
          VERSION=$(gh release list \
            --repo "$REPO" \
            --limit 100 \
            --json tagName \
            --jq "[.[] | select(.tagName | startswith(\"vpn-teardown/v${MAJOR}.\"))] | .[0].tagName // \"\"")
          if [ -z "$VERSION" ]; then
            echo "::warning::nenhuma release vpn-teardown/v${MAJOR}.x.y encontrada; pulando teardown"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::notice::tag flutuante $ACTION_REF resolvida para $VERSION"
        else
          echo "::error::ref '$ACTION_REF' não reconhecida — use v1 ou v1.x.y"
          exit 1
        fi

        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "skip=false" >> "$GITHUB_OUTPUT"
        echo "::notice::vpnctl versão $VERSION"

    # ----------- 3. Baixar vpnctl (reaproveita cache do vpn-setup) -----------
    - name: Baixar vpnctl
      if: steps.target.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: vcyber-tech/actions-rust
        VERSION: ${{ steps.version.outputs.version }}
        TARGET: ${{ steps.target.outputs.target }}
        BIN_DIR: ${{ runner.temp }}/toolshed-vpnctl
      run: |
        set -euo pipefail

        # Caso comum: vpn-setup no mesmo job já baixou o binário.
        if [ -x "$BIN_DIR/vpnctl" ]; then
          echo "::notice::vpnctl já em cache do job"
          echo "$BIN_DIR" >> "$GITHUB_PATH"
          exit 0
        fi

        mkdir -p "$BIN_DIR"
        ASSET="vpnctl-${TARGET}.tar.gz"

        if command -v gh >/dev/null 2>&1; then
          gh release download "$VERSION" \
            --repo "$REPO" \
            --pattern "$ASSET" \
            --pattern "$ASSET.sha256" \
            --dir "$BIN_DIR" \
            --clobber
        else
          BASE="https://github.com/${REPO}/releases/download/${VERSION}"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "${BASE}/${ASSET}" -o "${BIN_DIR}/${ASSET}"
          curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            "${BASE}/${ASSET}.sha256" -o "${BIN_DIR}/${ASSET}.sha256"
        fi

        ( cd "$BIN_DIR" && sha256sum -c "${ASSET}.sha256" )
        tar -xzf "${BIN_DIR}/${ASSET}" -C "$BIN_DIR"
        chmod +x "${BIN_DIR}/vpnctl"
        echo "$BIN_DIR" >> "$GITHUB_PATH"

    # ----------- 4. Desconectar (best-effort — nunca falha o job) -----------
    - name: Desconectar VPN
      if: steps.target.outputs.skip != 'true' && steps.version.outputs.skip != 'true'
      shell: bash
      env:
        # Se a VPN não subiu, ou se estamos em runner efêmera, isto é
        # no-op. Se subiu e há PID file, encerra o processo e limpa.
        RUNNER_TEMP: ${{ runner.temp }}
      run: |
        # Sem `set -e`: teardown é best-effort, nunca deve falhar o job.
        VPNCTL_BIN="$(command -v vpnctl 2>/dev/null || true)"
        if [ -z "$VPNCTL_BIN" ]; then
          echo "::warning::vpnctl não disponível; pulando teardown"
          exit 0
        fi

        echo "::group::vpnctl desconectar"
        if sudo --preserve-env=RUNNER_TEMP,GITHUB_ACTIONS \
                "$VPNCTL_BIN" desconectar; then
          echo "::notice::teardown concluído"
        else
          echo "::warning::teardown retornou erro, mas o job continua"
        fi
        echo "::endgroup::"
